<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Praktikum 3 - Layout DIV</title>

  <style>
    body{ font-family:Arial, sans-serif; }

    #header{
      background-color:black;
      color:white;
      text-align:center;
      padding:5px;
    }

    #nav{
      height:300px;
      width:100px;
      background-color:#eeeeee;
      margin:30px;
      float:left;
      padding:5px;
    }

    #section{
      width:350px;
      float:left;
      padding:10px;
    }

    #footer{
      background-color:black;
      color:white;
      clear:both;
      text-align:center;
      padding:5px;
    }
  </style>
</head>

<body>
  <div id="header">
    <h1>Kota Wisata</h1>
  </div>

  <div id="nav">
    <b>Menu</b><br><br>
    Magetan<br>
    Ponorogo<br>
    Madiun
  </div>

  <div id="section">
    <h2>Ponorogo</h2>
    <p>Ponorogo adalah kota yang mempunyai budaya cukup kuat, yaitu budaya reog.</p>
    <p>Berada di selatan kota Madiun, alamnya masih baik dan menyisakan nuansa pedesaan.</p>
    <p>Kuliner: sate Ponorogo dan dawet Jabung.</p>
  </div>

  <div id="footer">
    Dapat lebih lanjut kunjungi www.kuliner_jatim
  </div>
</body>
</html>
