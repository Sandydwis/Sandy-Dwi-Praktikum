<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Praktikum 1 - Inline Style</title>
</head>
<body>

<div style="position:relative; width:420px; margin:30px auto; font-family:Arial, sans-serif;">
  <div style="opacity:0.5; position:absolute; left:50px; top:-30px; width:300px; height:150px; background-color:#40B3DF;"></div>
  <div style="opacity:0.35; position:absolute; left:120px; top:30px; width:160px; height:110px; background-color:#73AD21;"></div>

  <div style="margin-top:30px; width:360px; padding:20px; border-radius:10px; border:10px solid #EE872A; font-size:120%; background:#fff; position:relative;">
    <h1 style="margin:0 0 10px 0;">CSS</h1>
    <p style="margin:0 0 12px 0;">Contoh penggunaan <b>inline style</b> dengan position & opacity.</p>
    <div style="letter-spacing:10px; font-size:14px; margin-bottom:12px;">INLINE • STYLE • DEMO</div>
    <span style="background-color:#B4009E; color:#ffffff; padding:6px 10px; border-radius:6px;">Highlight Text</span>
  </div>
</div>

</body>
</html>
