<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modul 8 - Konversi Nilai</title>
  <style>
    body{font-family:Arial, sans-serif; padding:20px; background:#f4f4f4;}
    .box{max-width:520px; background:#fff; padding:16px; border:1px solid #ddd; border-radius:10px;}
    label{display:block; margin:10px 0 6px;}
    input{width:100%; padding:10px; border:1px solid #bbb; border-radius:8px;}
    button{margin-top:12px; padding:10px 14px; border:0; border-radius:8px; cursor:pointer;}
    .btn{background:#222; color:#fff;}
    .result{margin-top:12px; padding:12px; background:#fafafa; border:1px dashed #999; border-radius:8px;}
    .small{margin-top:18px; font-size:12px; color:#666;}
    ul{margin:10px 0 0 18px;}
  </style>
</head>
<body>

  <div class="box">
    <h2>Konversi Nilai Angka → Nilai Huruf</h2>
    <p>Masukkan nilai 0–100, lalu klik tombol Konversi.</p>

    <label for="nilai">Nilai Angka (0-100)</label>
    <input type="number" id="nilai" min="0" max="100" placeholder="contoh: 78">

    <button class="btn" onclick="konversi()">Konversi</button>

    <div class="result" id="hasil">Hasil akan tampil di sini.</div>

    <div class="small">
      <b>Ketentuan:</b>
      <ul>
        <li>0–40 = E</li>
        <li>41–55 = D</li>
        <li>56–60 = C</li>
        <li>61–65 = BC</li>
        <li>66–70 = B</li>
        <li>71–80 = AB</li>
        <li>81–100 = A</li>
      </ul>
    </div>

    <div class="small" id="lastMod"></div>
  </div>

  <script>
    function konversi(){
      const nilaiInput = document.getElementById("nilai").value;
      const hasil = document.getElementById("hasil");

      // validasi kosong
      if (nilaiInput === "") {
        hasil.innerHTML = "❌ Masukkan nilai dulu.";
        return;
      }

      const n = Number(nilaiInput);

      // validasi rentang
      if (isNaN(n) || n < 0 || n > 100) {
        hasil.innerHTML = "❌ Nilai harus angka 0 sampai 100.";
        return;
      }

      let huruf = "";

      if (n >= 0 && n <= 40) huruf = "E";
      else if (n <= 55) huruf = "D";
      else if (n <= 60) huruf = "C";
      else if (n <= 65) huruf = "BC";
      else if (n <= 70) huruf = "B";
      else if (n <= 80) huruf = "AB";
      else huruf = "A";

      hasil.innerHTML = `✅ Nilai <b>${n}</b> = Nilai Huruf <b>${huruf}</b>`;
    }

    // contoh sesuai modul: lastModified
    document.getElementById("lastMod").innerHTML =
      "Dimodifikasi terakhir pada " + document.lastModified;
  </script>

</body>
</html>
